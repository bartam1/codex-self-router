[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "codex-self-router"
version = "0.6.1"
description = "A local Codex app-server proxy for explicit and agent-requested model routing"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "bartam1" }]
dependencies = ["PyYAML>=6.0,<7", "websockets>=15,<17"]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.25", "ruff>=0.11"]

[project.scripts]
codex-self-router = "codex_self_router.cli:main"

[project.urls]
Homepage = "https://github.com/bartam1/codex-self-router"
Repository = "https://github.com/bartam1/codex-self-router.git"
Issues = "https://github.com/bartam1/codex-self-router/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/codex_self_router"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
